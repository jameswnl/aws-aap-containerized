---
# Reusable task to append content to a file
# Required variables:
#   - info_file_marker: The marker name for blockinfile (e.g., "INSTALLATION INSTRUCTIONS")
#   - info_file_content: The content to append
#   - info_file_path: Full path to the file to write to

- name: Append content to file
  ansible.builtin.blockinfile:
    path: "{{ info_file_path }}"
    marker: "# {mark} {{ info_file_marker }}"
    block: "{{ info_file_content }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  become: false
