---
### AWS Infrastructure Variables
aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-2', true) }}"
aws_availability_zone: "{{ lookup('env', 'AWS_AZ') | default('us-east-2a', true) }}"
instance_type: >-
  {{ lookup('env', 'AWS_INSTANCE_TYPE') | default('t3.xlarge', true) }}
volume_size: >-
  {{ lookup('env', 'AWS_VOLUME_SIZE') | default('40', true) }}

# RHEL Version Selection (9 or 10)
rhel_version: >-
  {{ lookup('env', 'RHEL_VERSION') | default('9', true) }}

# AMI IDs for different RHEL versions in us-east-2
rhel_amis:
  "9": "ami-035032ea878eca201"  # RHEL 9.7 (updated 2025-11-05)
  "10": "ami-0dbc8afa42dccb430"  # RHEL 10.1.0 (updated 2025-11-05)

# Select AMI based on version or use custom AMI_ID
ami_id: "{{ lookup('env', 'AWS_AMI_ID') | default(rhel_amis[rhel_version], true) }}"

# Network Settings
vpc_cidr: >-
  {{ lookup('env', 'VPC_CIDR') | default('10.0.0.0/16', true) }}
subnet_cidr: >-
  {{ lookup('env', 'SUBNET_CIDR') | default('10.0.1.0/24', true) }}

# Tags
owner: >-
  {{ lookup('env', 'OWNER') | default('demo-user', true) }}
env: >-
  {{ lookup('env', 'ENVIRONMENT') | default('dev', true) }}

# Common tags applied to all AWS resources
common_tags:
  owner: "{{ owner }}"
  Environment: "{{ env }}"
  Project: "AAP-Containerized"
  ManagedBy: "Ansible"

### AAP Installer Variables
installer_admin_pw: >-
  {{ lookup('env', 'INSTALLER_ADMIN_PW') | default('ansible123', true) }}
installer_fqdn_hostname: >-
  {{ lookup('env', 'INSTALLER_FQDN_HOSTNAME') |
     default('aap.example.org', true) }}
registry_url: "{{ lookup('env', 'INSTALLER_REGISTRY_URL') | default('registry.redhat.io', true) }}"
registry_namespace: "{{ lookup('env', 'INSTALLER_REGISTRY_NAMESPACE') | default('ansible-automation-platform-26', true) }}"
registry_namespace_tp: "{{ lookup('env', 'INSTALLER_REGISTRY_NAMESPACE_TP') | default('ansible-automation-platform-26', true) }}"
registry_username: "{{ lookup('env', 'INSTALLER_REGISTRY_USERNAME') | default('', true) }}"
registry_password: "{{ lookup('env', 'INSTALLER_REGISTRY_PASSWORD') | default('', true) }}"
registry_verify: "{{ lookup('env', 'INSTALLER_REGISTRY_VERIFY') | default('true', true) | bool }}"

# Local setup bundle (pre-downloaded)
setup_bundle: >-
  ansible-automation-platform-containerized-setup-bundle-2.5-15.1-x86_64.tar.gz

# AAP Components to include
aap_include_controller: >-
  {{ lookup('env', 'AAP_INCLUDE_CONTROLLER') |
     default('true', true) | bool }}
aap_include_eda_controller: >-
  {{ lookup('env', 'AAP_INCLUDE_EDA_CONTROLLER') |
     default('false', true) | bool }}
aap_include_automation_hub: >-
  {{ lookup('env', 'AAP_INCLUDE_AUTOMATION_HUB') |
     default('false', true) | bool }}
aap_include_lightspeed: >-
  {{ lookup('env', 'AAP_INCLUDE_LIGHTSPEED') |
     default('false', true) | bool }}
aap_include_mcp: >-
  {{ lookup('env', 'AAP_INCLUDE_MCP') |
     default('false', true) | bool }}

# Installation Options
skip_system_update: >-
  {{ lookup('env', 'SKIP_SYSTEM_UPDATE') |
     default('false', true) | bool }}

# AAP Installer Directory (where the extracted bundle is located)
installer_directory: >-
  {{ lookup('env', 'INSTALLER_DIRECTORY') |
     default('/tmp/ansible-automation-platform-containerized-setup', true) }}

# Note: Manifest files can be uploaded later through the AAP web interface

# Lightspeed Configuration (required if aap_include_lightspeed is true)
lightspeed_admin_user: >-
  {{ lookup('env', 'LIGHTSPEED_ADMIN_USER') |
     default('admin', true) }}
lightspeed_admin_email: >-
  {{ lookup('env', 'LIGHTSPEED_ADMIN_EMAIL') |
     default('admin@example.com', true) }}
lightspeed_chatbot_model_url: >-
  {{ lookup('env', 'LIGHTSPEED_CHATBOT_MODEL_URL') |
     default('', true) }}
lightspeed_chatbot_model_api_key: >-
  {{ lookup('env', 'LIGHTSPEED_CHATBOT_MODEL_API_KEY') |
     default('', true) }}
lightspeed_chatbot_model_id: >-
  {{ lookup('env', 'LIGHTSPEED_CHATBOT_MODEL_ID') |
     default('', true) }}
lightspeed_mcp_controller_enabled: >-
  {{ lookup('env', 'LIGHTSPEED_MCP_CONTROLLER_ENABLED') |
     default('false', true) | bool }}
lightspeed_mcp_lightspeed_enabled: >-
  {{ lookup('env', 'LIGHTSPEED_MCP_LIGHTSPEED_ENABLED') |
     default('false', true) | bool }}
